[project]
name = "backend-h"
version = "0.1.0"
description = "FastAPI Backend API powered by Supabase"
readme = "README.md"
authors = [
    { name = "GetInLinePal", email = "anshyt7499@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend-h = "backend_h:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.vercel]
entrypoint = "main.py"

[tool.fastapi]
entrypoint = "main:app"

